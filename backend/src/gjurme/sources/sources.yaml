    name: Telegrafi
    homepage_url: https://telegrafi.com/
    feed_url: https://telegrafi.com/feed/
    discovery_urls: [https://telegrafi.com/]
    language: sq
    country: XK
    enabled: true
    notes: Verified 2026-09-24 — RSS 2.0, 30 items, title/link/date 100%. Highest-volume Kosovo portal.

