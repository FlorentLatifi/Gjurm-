# GJURMË source registry — the single place where news sources are declared.
#
# Adding a source = add an entry here, run `gjurme sources validate --slug <slug>` and then
# `gjurme sources sync`. No code changes are required.
#
# verification: "unverified" until `gjurme sources validate` has confirmed the feed from a
# network with open egress (the GitHub Actions "Source validation" workflow does this weekly).
# See docs/SOURCES.md for per-source notes, limitations and the latest validation report.
#
# discovery_urls: pages scanned for <link rel="alternate" type="application/rss+xml"> when the
# declared feed_url does not validate — the validator reports discovered feeds so the registry
# can be corrected with evidence instead of guesses.

sources:
  - slug: telegrafi
    name: Telegrafi
    homepage_url: https://telegrafi.com/
    feed_url: https://telegrafi.com/feed/
    discovery_urls: [https://telegrafi.com/]
    language: sq
    country: XK
    enabled: true
    notes: Highest-traffic Kosovo portal; very high publishing volume.

  - slug: koha
    name: KOHA
    homepage_url: https://www.koha.net/
    feed_url: https://www.koha.net/rss
    discovery_urls: [https://www.koha.net/]
    language: sq
    country: XK
    enabled: true
    notes: Kosovo newspaper of record (Koha Ditore / KohaVision).

  - slug: gazeta-express
    name: Gazeta Express
    homepage_url: https://www.gazetaexpress.com/
    feed_url: https://www.gazetaexpress.com/feed/
    discovery_urls: [https://www.gazetaexpress.com/]
    language: sq
    country: XK
    enabled: true
    notes: Broad-coverage Kosovo portal.

  - slug: kallxo
    name: Kallxo
    homepage_url: https://kallxo.com/
    feed_url: https://kallxo.com/feed/
    discovery_urls: [https://kallxo.com/]
    language: sq
    country: XK
    enabled: true
    notes: BIRN Kosovo — investigative, justice and fact-checking.

  - slug: evropa-e-lire
    name: Radio Evropa e Lirë
    homepage_url: https://www.evropaelire.org/
    feed_url: null  # resolved by `gjurme sources validate` autodiscovery (see docs/SOURCES.md)
    discovery_urls: [https://www.evropaelire.org/rssfeeds, https://www.evropaelire.org/]
    language: sq
    country: XK
    enabled: false
    notes: RFE/RL Albanian service. Official RSS index at /rssfeeds; exact feed URL resolved by validator autodiscovery.

  - slug: top-channel
    name: Top Channel
    homepage_url: https://top-channel.tv/
    feed_url: https://top-channel.tv/feed/
    discovery_urls: [https://top-channel.tv/]
    language: sq
    country: AL
    enabled: true
    notes: Major Albanian broadcaster — adds Albania coverage.

  - slug: balkan-insight
    name: Balkan Insight
    homepage_url: https://balkaninsight.com/
    feed_url: https://balkaninsight.com/feed/
    discovery_urls: [https://balkaninsight.com/rss-feeds/, https://balkaninsight.com/]
    language: en
    country: REG
    enabled: true
    notes: BIRN regional English-language coverage of the Balkans.
