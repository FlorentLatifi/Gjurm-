# GJURMË source registry — the single place where news sources are declared.
#
# Adding a source = add an entry here, run `gjurme sources validate --slug <slug>` and then
# `gjurme sources sync`. No code changes are required.
#
# Every `enabled: true` source below was verified by the "Source validation" GitHub Actions
# workflow (open egress) — see docs/SOURCES.md for the evidence table. Candidates stay
# `enabled: false` until the validator confirms a working feed that robots.txt permits.
#
# discovery_urls: pages scanned for <link rel="alternate" type="application/rss+xml"> when the
# declared feed_url does not validate.
#
# Ratings (coverage bars and blindspots, docs/SOURCES.md#ratings):
#   bias:        left | lean_left | center | lean_right | right | unrated   (default unrated)
#   factuality:  very_high | high | mixed | low | very_low | unrated          (default unrated)
#   ownership:   private | media_group | public | state | public_international | nonprofit |
#                unknown                                                    (default unknown)
#   owner:       who owns or publishes it (free text, optional)
#   ratings_note: what the ratings are based on — required once bias or factuality is set.
# bias and factuality are editorial judgements: set them only from a documented review, never
# by guessing. Unrated outlets are shown as "unrated" in every coverage bar.
#
# images: false hides the photos this outlet puts in its feed (default true; ADR-030). Set it
# when an outlet asks for its photos not to be shown on GJURMË.

