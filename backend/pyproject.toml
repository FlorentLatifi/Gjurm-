[project]
name = "gjurme"
version = "1.0.0"
description = "GJURMË — AI-powered Albanian & Balkan news intelligence: RSS ingestion, LLM enrichment, analytics API."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.53,<0.54",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "feedparser>=6.0.14,<6.1",
    "httpx>=0.28,<0.29",
    "beautifulsoup4>=4.15,<4.16",
    "typer>=0.27,<0.28",
    "prometheus-client>=0.26,<0.27",
    "anthropic>=1.8,<2",
    "pyyaml>=6.0,<7",
    "tzdata>=2026.1",
]

[project.scripts]
gjurme = "gjurme.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "respx>=0.23,<0.24",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "types-pyyaml",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gjurme"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "DTZ"]
ignore = [
    "S101",   # asserts are fine in tests
    "RUF001", # Albanian text legitimately contains ambiguous-looking unicode
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends/Query defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "N802", "PT018", "RUF012", "PT022"]
"src/gjurme/migrations/**" = ["E501", "UP", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["gjurme"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "bs4.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:feedparser.*",
]

[tool.coverage.run]
source = ["gjurme"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
