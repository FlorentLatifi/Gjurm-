# Verifies every registered RSS source from a network with open egress and publishes the
# evidence (format, item count, field coverage, timestamps, discovered alternatives), then runs
# the real pipeline against the live feeds. This is how feed URLs are *verified* rather than
# assumed — see docs/SOURCES.md.
name: Source validation

on:
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "Articles to analyse with Claude when ANTHROPIC_API_KEY is set (1-50; budget capped at $0.02 each, max $1)"
        type: number
        default: 8
      export_headlines:
        description: "Print a balanced sample of N headlines (no excerpts) for an offline quality review (0 = off, max 60)"
        type: number
        default: 0
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  push:
    paths:
      - "backend/src/gjurme/sources/**"
      - "backend/src/gjurme/ingestion/**"
      - ".github/workflows/sources.yml"

permissions:
  contents: read

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Validate sources
        run: |
          uv run gjurme sources validate \
            --markdown "$RUNNER_TEMP/source-report.md" \
            --json "$RUNNER_TEMP/source-report.json"
      - name: Publish summary
        if: always()
        run: cat "$RUNNER_TEMP/source-report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-report
          path: ${{ runner.temp }}/source-report.*
          retention-days: 90

  # End-to-end run of the real pipeline against the live feeds (fresh database every time).
  # Uses the zero-cost keyword rules unless the repository has an ANTHROPIC_API_KEY secret, in
  # which case the newest articles (8 by default, up to 50 on manual runs) are analysed by Claude
  # under a hard budget, and a review report of every result is published for a quality check.
  live-pipeline:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gjurme
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gjurme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gjurme" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gjurme:ci-only-password@localhost:5432/gjurme
      GJURME_ENV: test
      LOG_FORMAT: text
      HAS_LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run gjurme db upgrade
      - name: Ingest + process live feeds
        run: uv run gjurme run --stages ingest,process | tee "$RUNNER_TEMP/run-ingest.json"
      - name: Headline sample for an offline quality review (headlines only, never excerpts)
        if: inputs.export_headlines > 0
        env:
          PGPASSWORD: ci-only-password
          N: ${{ inputs.export_headlines }}
        run: |
          if ! [[ "$N" =~ ^[0-9]+$ ]] || (( N < 1 || N > 60 )); then
            echo "::error::export_headlines must be between 1 and 60"; exit 1
          fi
          # Newest items spread across sources; only fields the public site shows anyway.
          psql -h localhost -U gjurme -d gjurme -At -c "
            SELECT json_agg(x ORDER BY x.source, x.published_at DESC) FROM (
              SELECT a.id, s.slug AS source, a.published_at, a.title
              FROM (SELECT *, row_number() OVER (PARTITION BY source_id ORDER BY published_at DESC) AS rn
                    FROM core.articles) a
              JOIN core.sources s ON s.id = a.source_id
              ORDER BY a.rn, a.published_at DESC LIMIT $N) x;" > "$RUNNER_TEMP/headline-sample.json"
          echo "HEADLINE_SAMPLE_BEGIN"
          cat "$RUNNER_TEMP/headline-sample.json"
          echo "HEADLINE_SAMPLE_END"
      - name: Enrich (Claude, capped)
        if: env.HAS_LLM_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          LIMIT: ${{ inputs.enrich_limit || 8 }}
        run: |
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 50 )); then
            echo "::error::enrich_limit must be between 1 and 50"; exit 1
          fi
          export ENRICH_MAX_PER_RUN="$LIMIT"
          LLM_DAILY_BUDGET_USD="$(python3 -c "print(min(1.0, $LIMIT * 0.02))")"
          export LLM_DAILY_BUDGET_USD
          echo "Analysing up to $LIMIT articles with a hard budget of \$$LLM_DAILY_BUDGET_USD"
          uv run gjurme run --stages enrich,quality | tee "$RUNNER_TEMP/run-enrich.json"
      - name: Claude quality review (every result, tokens and cost)
        if: env.HAS_LLM_KEY == 'true'
        env:
          PGPASSWORD: ci-only-password
        run: |
          review="$RUNNER_TEMP/claude-quality-review.md"
          q() { psql -h localhost -U gjurme -d gjurme -P pager=off -c "$1"; }
          {
            echo "## Claude quality review"
            echo
            echo "Check each row against its headline: topic, tone, names (persons/orgs/places), summary."
            echo "\`dropped\` = names the grounding check removed because they are not in the text."
            echo
            echo '```'
            q "SELECT count(*) AS calls, count(*) FILTER (WHERE status = 'succeeded') AS ok,
                      round(sum(cost_usd), 4) AS usd_total, round(avg(cost_usd), 5) AS usd_per_call,
                      sum(input_tokens) AS input_tok, sum(cache_read_tokens) AS cache_read_tok,
                      sum(cache_write_tokens) AS cache_write_tok, sum(output_tokens) AS output_tok,
                      round(avg(latency_ms)) AS avg_ms
               FROM core.enrichments WHERE provider = 'anthropic';"
            q "SELECT status, left(error, 160) AS error FROM core.enrichments
               WHERE provider = 'anthropic' AND status <> 'succeeded';"
            q "SELECT s.slug, left(a.title, 90) AS title, t.slug AS topic,
                      a.sentiment_label || ' ' || a.sentiment_score AS tone,
                      (SELECT string_agg(e.name || ' [' || left(e.type, 3) || ']', ', '
                                         ORDER BY e.type, e.name)
                         FROM core.article_entities ae JOIN core.entities e ON e.id = ae.entity_id
                        WHERE ae.article_id = a.id) AS names,
                      en.quality_flags -> 'entities_ungrounded' AS dropped,
                      left(a.summary_en, 160) AS summary, a.enrichment_confidence AS conf
               FROM core.enrichments en JOIN core.articles a ON a.id = en.article_id
               JOIN core.sources s ON s.id = a.source_id
               LEFT JOIN core.topics t ON t.id = a.primary_topic_id
               WHERE en.is_current AND en.provider = 'anthropic'
               ORDER BY a.published_at DESC;"
            echo '```'
          } > "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"
      - name: Enrich (heuristic, no key configured)
        if: env.HAS_LLM_KEY != 'true'
        env:
          LLM_PROVIDER: fake
        run: uv run gjurme run --stages enrich,quality | tee "$RUNNER_TEMP/run-enrich.json"
      - name: Sample of stored articles
        if: always()
        run: |
          {
            echo "## Live pipeline sample"
            echo
            echo '```'
            PGPASSWORD=ci-only-password psql -h localhost -U gjurme -d gjurme -c "
              SELECT s.slug, count(*) AS articles, min(a.published_at)::timestamp(0) AS oldest,
                     max(a.published_at)::timestamp(0) AS newest,
                     count(*) FILTER (WHERE a.enrichment_status = 'succeeded') AS enriched
              FROM core.articles a JOIN core.sources s ON s.id = a.source_id
              GROUP BY s.slug ORDER BY s.slug;"
            PGPASSWORD=ci-only-password psql -h localhost -U gjurme -d gjurme -c "
              SELECT s.slug, left(a.title, 90) AS title, t.slug AS topic, a.sentiment_label
              FROM core.articles a JOIN core.sources s ON s.id = a.source_id
              LEFT JOIN core.topics t ON t.id = a.primary_topic_id
              ORDER BY a.published_at DESC LIMIT 15;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-pipeline-stats
          path: |
            ${{ runner.temp }}/run-*.json
            ${{ runner.temp }}/claude-quality-review.md
          if-no-files-found: ignore
          retention-days: 30
