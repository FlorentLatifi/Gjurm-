# Quality test for a FREE local model: runs the real pipeline against the live feeds and has an
# open-weight model, served by Ollama on GitHub's runner, analyse the newest articles. Costs $0 and
# needs no key. The review report has the same shape as the Claude one in sources.yml, so the two
# can be compared side by side. Manual runs test one model; pushes that change the provider, the
# prompt or this workflow compare three. With "hosted" ticked, a manual run tests the free hosted
# model the Free hosting workflow would use instead (secret LLM_API_KEY; base_url or the variable
# LLM_BASE_URL; model or the variable LLM_MODEL), so it can be judged before it analyses the live
# site: the live site uses it as soon as the LLM_BASE_URL variable exists. See
# docs/AI_ENRICHMENT.md#free-models.
name: Free model quality

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag (e.g. gemma3:4b, qwen3:4b, gemma3:12b). Empty: gemma3:4b,
          or with hosted the LLM_MODEL variable"
        type: string
        default: ""
      hosted:
        description: "Test the hosted free model (LLM_API_KEY secret) instead of Ollama"
        type: boolean
        default: false
      base_url:
        description: "With hosted: the server's URL. Empty: the LLM_BASE_URL variable"
        type: string
        default: ""
      fallback_key:
        description: "With hosted: use the LLM_FALLBACK_API_KEY secret (the second model, e.g. Groq)"
        type: boolean
        default: false
      response_format:
        description: "With hosted: json_schema, json_object (Groq) or prompt. Empty: the variable"
        type: string
        default: ""
      enrich_limit:
        description: "Articles to analyse (1-40; locally CPU-only, roughly 20-60 s each)"
        type: number
        default: 15
  push:
    paths:
      - "backend/src/gjurme/enrichment/providers.py"
      - "backend/src/gjurme/enrichment/prompt.py"
      - ".github/workflows/free-model-quality.yml"

permissions:
  contents: read

concurrency:
  group: free-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-model:
    name: ${{ inputs.hosted && 'hosted' || 'local' }}-model (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && format('["{0}"]', inputs.model || (inputs.hosted && vars.LLM_MODEL) || 'gemma3:4b')
          || '["gemma3:4b", "qwen3:4b", "gemma3:12b"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gjurme
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gjurme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gjurme" --health-interval 5s --health-timeout 5s
          --health-retries 10
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_CONTEXT_LENGTH: "8192"
          OLLAMA_KEEP_ALIVE: "2h"
        ports: ["11434:11434"]
    env:
      DATABASE_URL: postgresql+psycopg://gjurme:ci-only-password@localhost:5432/gjurme
      GJURME_ENV: test
      LOG_FORMAT: text
      MODEL: ${{ matrix.model }}
      LIMIT: ${{ inputs.enrich_limit || 15 }}
      HOSTED: ${{ inputs.hosted && 'true' || 'false' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check inputs
        env:
          HOSTED_BASE_URL: ${{ inputs.base_url || vars.LLM_BASE_URL }}
        run: |
          if ! [[ "$MODEL" =~ ^[A-Za-z0-9._:/-]{1,80}$ ]]; then
            echo "::error::invalid model tag"; exit 1
          fi
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 40 )); then
            echo "::error::enrich_limit must be between 1 and 40"; exit 1
          fi
          if [ "$HOSTED" = true ] && ! [[ "$HOSTED_BASE_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::hosted needs base_url (or the LLM_BASE_URL variable) and the LLM_API_KEY secret. docs/NISJA.md, \"AI falas pa server\"."
            exit 1
          fi
      - name: Download the model
        if: env.HOSTED != 'true'
        run: |
          for _ in $(seq 30); do curl -fsS http://localhost:11434/api/version && break; sleep 2; done
          echo
          curl -fsS --max-time 1200 http://localhost:11434/api/pull \
            -d "{\"model\": \"$MODEL\", \"stream\": false}"
          echo
          curl -fsS http://localhost:11434/api/tags
      - run: uv sync --frozen --no-dev
      - run: uv run gjurme db upgrade
      - name: Ingest + process live feeds
        run: uv run gjurme run --stages ingest,process
      - name: Enrich with the model
        env:
          LLM_PROVIDER: openai_compatible
          LLM_BASE_URL: >-
            ${{ inputs.hosted && (inputs.base_url || vars.LLM_BASE_URL) || 'http://localhost:11434/v1' }}
          LLM_API_KEY: >-
            ${{ inputs.hosted && (inputs.fallback_key && secrets.LLM_FALLBACK_API_KEY
            || secrets.LLM_API_KEY) || '' }}
          LLM_MODEL: ${{ env.MODEL }}
          LLM_RESPONSE_FORMAT: >-
            ${{ inputs.hosted && (inputs.response_format || vars.LLM_RESPONSE_FORMAT)
            || 'json_schema' }}
          LLM_REQUESTS_PER_MINUTE: ${{ inputs.hosted && (vars.LLM_REQUESTS_PER_MINUTE || '10') || '0' }}
          LLM_TIMEOUT_SECONDS: "600"
          ENRICH_CONCURRENCY: "1"
          ENRICH_CIRCUIT_BREAKER_THRESHOLD: "10"
        run: |
          [ -n "$LLM_API_KEY" ] || unset LLM_API_KEY
          export ENRICH_MAX_PER_RUN="$LIMIT"
          uv run gjurme run --stages enrich,quality | tee "$RUNNER_TEMP/run-enrich.json"
      - name: Quality review (every result)
        if: always()
        env:
          PGPASSWORD: ci-only-password
        run: |
          review="$RUNNER_TEMP/free-model-quality-review.md"
          q() { psql -h localhost -U gjurme -d gjurme -P pager=off -c "$1"; }
          {
            echo "## Free model quality review: \`$MODEL\`"
            echo
            echo "Check each row against its headline: topic, tone, names (persons/orgs/places), both summaries."
            echo "\`dropped\` = names the grounding check removed because they are not in the text;"
            echo "\`not_names\` = common nouns removed because no word is capitalised."
            if [ "$HOSTED" = true ]; then
              echo "Hosted free tier (\$0 within its limits); \`avg_s\` includes the pacing under its rate limit."
            else
              echo "Cost is \$0; \`avg_s\` is the time per article on a 4-core CPU without a GPU."
            fi
            echo
            echo '```'
            q "SELECT count(*) AS calls, count(*) FILTER (WHERE status = 'succeeded') AS ok,
                      count(*) FILTER (WHERE status = 'invalid') AS invalid_json,
                      round(avg(latency_ms) / 1000.0, 1) AS avg_s,
                      sum(input_tokens) AS input_tok, sum(output_tokens) AS output_tok
               FROM core.enrichments WHERE provider = 'openai_compatible';"
            q "SELECT status, left(error, 160) AS error FROM core.enrichments
               WHERE provider = 'openai_compatible' AND status <> 'succeeded';"
            q "SELECT s.slug, left(a.title, 90) AS title, t.slug AS topic,
                      a.sentiment_label || ' ' || a.sentiment_score AS tone,
                      (SELECT string_agg(e.name || ' [' || left(e.type, 3) || ']', ', '
                                         ORDER BY e.type, e.name)
                         FROM core.article_entities ae JOIN core.entities e ON e.id = ae.entity_id
                        WHERE ae.article_id = a.id) AS names,
                      en.quality_flags -> 'entities_ungrounded' AS dropped,
                      en.quality_flags -> 'entities_not_proper' AS not_names,
                      left(a.summary_en, 160) AS summary_en, left(a.summary_sq, 160) AS summary_sq,
                      a.enrichment_confidence AS conf
               FROM core.enrichments en JOIN core.articles a ON a.id = en.article_id
               JOIN core.sources s ON s.id = a.source_id
               LEFT JOIN core.topics t ON t.id = a.primary_topic_id
               WHERE en.is_current AND en.provider = 'openai_compatible'
               ORDER BY a.published_at DESC;"
            echo '```'
          } > "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"
          cat "$review"
          ok=$(psql -h localhost -U gjurme -d gjurme -tAc "SELECT count(*) FROM core.enrichments
               WHERE provider = 'openai_compatible' AND status = 'succeeded';")
          if [ "$ok" = 0 ]; then
            echo "::error::The model analysed no article: see the errors above (an unknown or retired model is HTTP 404)."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: free-model-quality-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/run-enrich.json
            ${{ runner.temp }}/free-model-quality-review.md
          if-no-files-found: ignore
          retention-days: 30
